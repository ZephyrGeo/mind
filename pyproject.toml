[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mind-personal-agent-api"
version = "0.2.0"
description = "FastAPI foundation and replaceable Agent Kernel for Mind."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "uvicorn==0.52.0",
]

[project.optional-dependencies]
test = [
  "httpx2==2.7.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["backend"]
exclude = ["backend/tests"]
