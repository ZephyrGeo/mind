name: Continuous quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install web dependencies
        run: npm ci

      - name: Install locked API dependencies
        run: |
          python -m pip install --requirement requirements.lock
          python -m pip install --requirement requirements-dev.lock

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.27.0

      - name: Lint Python
        run: ruff check backend

      - name: Type-check kernel contracts
        run: >-
          pyright
          backend/config.py
          backend/models.py
          backend/repositories.py
          backend/research_repositories.py
          backend/file_store.py
          backend/file_storage.py
          backend/file_service.py
          backend/research_provider.py
          backend/openai_research_provider.py
          backend/research_resilience.py
          backend/usage_limits.py
          backend/research_service.py

      - name: Build and test without model calls
        env:
          PYTHON: python
        run: npm run test:all

      - name: Verify Firestore tenant rules
        run: npm run test:rules

      - name: Build the API container
        run: docker build --tag mind-api:test .

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without a backend
        run: terraform init -backend=false

      - name: Validate Terraform
        run: terraform validate
